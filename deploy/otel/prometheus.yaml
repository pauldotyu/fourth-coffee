global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: fourth-coffee-apps
    metrics_path: /metrics
    static_configs:
      - targets:
          - fourth-coffee-mcp:8101
          - ops-agent:8202
          - concierge:8301
