secret:
  data:
    APPLICATIONINSIGHTS_CONNECTION_STRING: ""
    OPENAI_API_KEY: ""

workloadIdentity:
  enabled: true
  clientId: 11111111-1111-1111-1111-111111111111
  serviceAccounts:
    fourth-coffee-mcp:
      name: fourth-coffee-mcp-telemetry
      create: true
      # Replace with a telemetry-only identity, without model access.
      clientId: 22222222-2222-2222-2222-222222222222

components:
