{{- $sharedNeeded := false }}
{{- range .Values.components }}
{{- if and .workloadIdentity (not (hasKey $.Values.workloadIdentity.serviceAccounts .name)) }}
{{- $sharedNeeded = true }}
{{- end }}
{{- end }}
{{- if and .Values.workloadIdentity.enabled .Values.workloadIdentity.serviceAccount.create $sharedNeeded }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fourth-coffee.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fourth-coffee.labels" . | nindent 4 }}
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required when workload identity is enabled" .Values.workloadIdentity.clientId | quote }}
{{- end }}
{{- if .Values.workloadIdentity.enabled }}
{{- range $component, $account := .Values.workloadIdentity.serviceAccounts }}
{{- if dig "create" true $account }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required (printf "workloadIdentity.serviceAccounts.%s.name is required" $component) $account.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "fourth-coffee.labels" $ | nindent 4 }}
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: {{ required (printf "workloadIdentity.serviceAccounts.%s.clientId is required" $component) $account.clientId | quote }}
{{- end }}
{{- end }}
{{- end }}
