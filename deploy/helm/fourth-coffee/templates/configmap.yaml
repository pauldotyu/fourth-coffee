apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fourth-coffee.labels" . | nindent 4 }}
    app.kubernetes.io/name: fourth-coffee
    app.kubernetes.io/component: config
data:
  APP_VERSION: {{ include "fourth-coffee.version" . | quote }}
  {{- range $name, $value := .Values.config }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
